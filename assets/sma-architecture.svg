<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Search Metric Analyzer architecture diagram">
  <title>SMA Architecture</title>
  <desc>Four-stage pipeline (Understand, Hypothesize, Dispatch, Synthesize) fed by a six-item Knowledge Layer with a Memory feedback loop from Synthesize back to Hypothesize.</desc>

  <defs>
    <marker id="arrow-terra" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 10,4 0,8" fill="#D97757"/>
    </marker>
    <marker id="arrow-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 9,3.5 0,7" fill="#5a5a5a"/>
    </marker>
    <marker id="arrow-terra-loop" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 9,3.5 0,7" fill="#B85E42"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #f8f6f3; }
    .title { font-family: 'Source Serif 4', Georgia, serif; font-size: 20px; font-weight: 700; fill: #1a1a1a; }
    .subtitle { font-family: 'IBM Plex Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #6a6a6a; letter-spacing: 1.5px; text-transform: uppercase; }
    .eyebrow { font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 10px; font-weight: 500; fill: #6a6a6a; letter-spacing: 1.4px; text-transform: uppercase; }
    .stage-num { font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 11px; font-weight: 500; fill: #B85E42; letter-spacing: 1.5px; }
    .stage-name { font-family: 'Source Serif 4', Georgia, serif; font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    .stage-sub { font-family: 'IBM Plex Sans', -apple-system, sans-serif; font-size: 11px; fill: #4a4a4a; }
    .kn-item { font-family: 'IBM Plex Sans', -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #1a1a1a; }
    .loop-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; fill: #B85E42; letter-spacing: 1px; }
    .legend { font-family: 'IBM Plex Sans', -apple-system, sans-serif; font-size: 11px; fill: #4a4a4a; }
  </style>

  <!-- Warm cream background -->
  <rect class="bg" width="960" height="520"/>

  <!-- Title -->
  <text class="title" x="50" y="42">Search Metric Analyzer</text>
  <text class="subtitle" x="50" y="62">Four-stage diagnostic pipeline · v2 skill + harness</text>

  <!-- ================================================== -->
  <!-- KNOWLEDGE LAYER (top container) -->
  <!-- ================================================== -->
  <rect x="50" y="94" width="860" height="80" rx="10" ry="10"
        fill="#ffffff" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.95"/>
  <text class="eyebrow" x="62" y="112">Knowledge Layer</text>

  <!-- 6 Knowledge items -->
  <g>
    <rect x="70" y="122" width="132" height="40" rx="6" ry="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1"/>
    <text class="kn-item" x="136" y="147" text-anchor="middle">Playbooks</text>

    <rect x="214" y="122" width="132" height="40" rx="6" ry="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1"/>
    <text class="kn-item" x="280" y="147" text-anchor="middle">SEV Archive</text>

    <rect x="358" y="122" width="132" height="40" rx="6" ry="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1"/>
    <text class="kn-item" x="424" y="147" text-anchor="middle">Metric Registry</text>

    <rect x="502" y="122" width="132" height="40" rx="6" ry="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1"/>
    <text class="kn-item" x="568" y="147" text-anchor="middle">Domain Digests</text>

    <rect x="646" y="122" width="132" height="40" rx="6" ry="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1"/>
    <text class="kn-item" x="712" y="147" text-anchor="middle">Corrections Index</text>

    <rect x="790" y="122" width="108" height="40" rx="6" ry="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1"/>
    <text class="kn-item" x="844" y="147" text-anchor="middle">Schema Catalog</text>
  </g>

  <!-- Knowledge taps (dashed gray, dropping to stages) -->
  <line x1="136" y1="174" x2="136" y2="220" stroke="#5a5a5a" stroke-width="1.3" stroke-dasharray="3,3"/>
  <line x1="360" y1="174" x2="360" y2="220" stroke="#5a5a5a" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arrow-gray)"/>
  <line x1="590" y1="174" x2="590" y2="220" stroke="#5a5a5a" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arrow-gray)"/>

  <!-- ================================================== -->
  <!-- PIPELINE STAGES (4 horizontal) -->
  <!-- ================================================== -->
  <g>
    <!-- Stage 01 — Understand -->
    <rect x="56" y="230" width="160" height="90" rx="12" ry="12"
          fill="#FAEEE7" stroke="#D97757" stroke-width="2.5"/>
    <text class="stage-num" x="136" y="256" text-anchor="middle">01</text>
    <text class="stage-name" x="136" y="280" text-anchor="middle">Understand</text>
    <text class="stage-sub" x="136" y="300" text-anchor="middle">Parse + route</text>

    <!-- Stage 02 — Hypothesize -->
    <rect x="280" y="230" width="160" height="90" rx="12" ry="12"
          fill="#FAEEE7" stroke="#D97757" stroke-width="2.5"/>
    <text class="stage-num" x="360" y="256" text-anchor="middle">02</text>
    <text class="stage-name" x="360" y="280" text-anchor="middle">Hypothesize</text>
    <text class="stage-sub" x="360" y="300" text-anchor="middle">Gate + generate</text>

    <!-- Stage 03 — Dispatch -->
    <rect x="510" y="230" width="160" height="90" rx="12" ry="12"
          fill="#FAEEE7" stroke="#D97757" stroke-width="2.5"/>
    <text class="stage-num" x="590" y="256" text-anchor="middle">03</text>
    <text class="stage-name" x="590" y="280" text-anchor="middle">Dispatch</text>
    <text class="stage-sub" x="590" y="300" text-anchor="middle">Parallel sub-agents</text>

    <!-- Stage 04 — Synthesize -->
    <rect x="740" y="230" width="160" height="90" rx="12" ry="12"
          fill="#FAEEE7" stroke="#D97757" stroke-width="2.5"/>
    <text class="stage-num" x="820" y="256" text-anchor="middle">04</text>
    <text class="stage-name" x="820" y="280" text-anchor="middle">Synthesize</text>
    <text class="stage-sub" x="820" y="300" text-anchor="middle">Reconcile + score</text>
  </g>

  <!-- Main pipeline arrows (solid terracotta, 2.5px) -->
  <line x1="216" y1="275" x2="278" y2="275" stroke="#D97757" stroke-width="2.5" marker-end="url(#arrow-terra)"/>
  <line x1="440" y1="275" x2="508" y2="275" stroke="#D97757" stroke-width="2.5" marker-end="url(#arrow-terra)"/>
  <line x1="670" y1="275" x2="738" y2="275" stroke="#D97757" stroke-width="2.5" marker-end="url(#arrow-terra)"/>

  <!-- ================================================== -->
  <!-- MEMORY / LEARNINGS FEEDBACK LOOP -->
  <!-- Curved arrow from Synthesize bottom -> around under -> Hypothesize bottom -->
  <!-- ================================================== -->
  <path d="M 820 325 Q 820 410 500 410 Q 280 410 280 325"
        fill="none" stroke="#B85E42" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-terra-loop)"/>

  <!-- Learnings label with wider background -->
  <rect x="476" y="398" width="120" height="24" rx="4" ry="4" fill="#f8f6f3"/>
  <text class="loop-label" x="536" y="414" text-anchor="middle">LEARNINGS</text>

  <!-- ================================================== -->
  <!-- LEGEND (bottom left, quiet) -->
  <!-- ================================================== -->
  <g transform="translate(50, 460)">
    <!-- Main flow -->
    <line x1="0" y1="6" x2="22" y2="6" stroke="#D97757" stroke-width="2.5" marker-end="url(#arrow-terra)"/>
    <text class="legend" x="32" y="10">Pipeline stage flow</text>

    <!-- Knowledge tap -->
    <line x1="170" y1="6" x2="192" y2="6" stroke="#5a5a5a" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arrow-gray)"/>
    <text class="legend" x="202" y="10">Knowledge routed into stages</text>

    <!-- Memory feedback -->
    <line x1="430" y1="6" x2="452" y2="6" stroke="#B85E42" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-terra-loop)"/>
    <text class="legend" x="462" y="10">Memory feedback (learnings)</text>
  </g>

  <!-- Quiet attribution -->
  <text class="eyebrow" x="910" y="500" text-anchor="end">github.com/surahli123/search-metric-analyzer</text>
</svg>
