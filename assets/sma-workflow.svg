<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="workflow-title workflow-description">
  <title id="workflow-title">Search Metric Analyzer evidence workflow</title>
  <desc id="workflow-description">Four stages move from decomposing a metric change, to detecting patterns, diagnosing competing explanations, and reporting conclusions with evidence and next actions.</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a681c"/>
    </marker>
  </defs>

  <rect width="1200" height="420" fill="#faf8f3"/>
  <text x="64" y="72" fill="#2b2a38" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="23" font-weight="700">From metric movement to an evidence-linked decision</text>
  <text x="64" y="103" fill="#6b6a78" font-family="Spline Sans Mono, Menlo, monospace" font-size="14">deterministic analysis carries the evidence; structured interpretation turns it into action</text>

  <line x1="278" y1="231" x2="336" y2="231" stroke="#8a681c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="558" y1="231" x2="616" y2="231" stroke="#8a681c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="838" y1="231" x2="896" y2="231" stroke="#8a681c" stroke-width="2" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="56" y="156" width="222" height="150" fill="#ffffff" stroke="#dcd6c8" stroke-width="1"/>
    <text x="80" y="192" fill="#8a681c" font-family="Spline Sans Mono, Menlo, monospace" font-size="13" letter-spacing="2">01</text>
    <text x="80" y="226" fill="#2b2a38" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="25" font-weight="700">Decompose</text>
    <text x="80" y="266" fill="#6b6a78" font-family="Spline Sans Mono, Menlo, monospace" font-size="13">Find the segments driving</text>
    <text x="80" y="288" fill="#6b6a78" font-family="Spline Sans Mono, Menlo, monospace" font-size="13">the observed movement.</text>
  </g>

  <g>
    <rect x="336" y="156" width="222" height="150" fill="#ffffff" stroke="#dcd6c8" stroke-width="1"/>
    <text x="360" y="192" fill="#8a681c" font-family="Spline Sans Mono, Menlo, monospace" font-size="13" letter-spacing="2">02</text>
    <text x="360" y="226" fill="#2b2a38" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="25" font-weight="700">Detect</text>
    <text x="360" y="266" fill="#6b6a78" font-family="Spline Sans Mono, Menlo, monospace" font-size="13">Compare step changes and</text>
    <text x="360" y="288" fill="#6b6a78" font-family="Spline Sans Mono, Menlo, monospace" font-size="13">cross-metric movement.</text>
  </g>

  <g>
    <rect x="616" y="156" width="222" height="150" fill="#ffffff" stroke="#dcd6c8" stroke-width="1"/>
    <text x="640" y="192" fill="#8a681c" font-family="Spline Sans Mono, Menlo, monospace" font-size="13" letter-spacing="2">03</text>
    <text x="640" y="226" fill="#2b2a38" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="25" font-weight="700">Diagnose</text>
    <text x="640" y="266" fill="#6b6a78" font-family="Spline Sans Mono, Menlo, monospace" font-size="13">Evaluate competing patterns</text>
    <text x="640" y="288" fill="#6b6a78" font-family="Spline Sans Mono, Menlo, monospace" font-size="13">with explicit confidence.</text>
  </g>

  <g>
    <rect x="896" y="156" width="248" height="150" fill="#2b2a38"/>
    <text x="920" y="192" fill="#e0ab42" font-family="Spline Sans Mono, Menlo, monospace" font-size="13" letter-spacing="2">04</text>
    <text x="920" y="226" fill="#f7f5f0" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="25" font-weight="700">Report</text>
    <text x="920" y="266" fill="#c9c4d4" font-family="Spline Sans Mono, Menlo, monospace" font-size="13">Attach evidence, conclusions,</text>
    <text x="920" y="288" fill="#c9c4d4" font-family="Spline Sans Mono, Menlo, monospace" font-size="13">and concrete next actions.</text>
  </g>

  <text x="64" y="365" fill="#6b6a78" font-family="Spline Sans Mono, Menlo, monospace" font-size="13">Each stage remains inspectable, so analysts can challenge the conclusion and trace it back to source evidence.</text>
</svg>
